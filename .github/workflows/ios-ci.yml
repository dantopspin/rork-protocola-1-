name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -80

      - name: Resolve Swift packages
        run: |
          xcodebuild             -resolvePackageDependencies             -project ios-protocola/Protocola.xcodeproj             -scheme Protocola

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild             build             -project ios-protocola/Protocola.xcodeproj             -scheme Protocola             -configuration Release             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             | xcbeautify

      - name: Run unit and UI tests
        run: |
          set -o pipefail
          xcodebuild             test             -project ios-protocola/Protocola.xcodeproj             -scheme Protocola             -configuration Debug             -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'             -parallel-testing-enabled NO             -resultBundlePath TestResults.xcresult             CODE_SIGNING_ALLOWED=NO             | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

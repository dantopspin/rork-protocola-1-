name: Design screenshots

# Renders the main screens with demo data and publishes the PNGs to the
# `design-screenshots` branch under <commit sha>/, so visual changes can be
# reviewed without a local simulator. Runs on design/* branches or manually.

on:
  push:
    branches:
      - 'design/**'
  workflow_dispatch:

concurrency:
  group: design-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Capture screens
        continue-on-error: true
        run: |
          xcodebuild test \
            -project ios-protocola/Protocola.xcodeproj \
            -scheme Protocola \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -only-testing:ProtocolaUITests/DesignSnapshotTests \
            -parallel-testing-enabled NO \
            -resultBundlePath Shots.xcresult \
            CODE_SIGNING_ALLOWED=NO > capture.log 2>&1 && code=0 || code=$?
          report() { python3 -c 'import sys,urllib.parse; d=sys.stdin.read()[-3500:]; print(d.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          echo "::warning title=capture exit $code::$(grep -E 'error:|Failed|failed|Executed|\*\* TEST' capture.log | tail -n 25 | report)"
          exit 0

      - name: Capture paywall on other iPhone sizes
        continue-on-error: true
        run: |
          # The runner ships only some iPhones; create the smallest and the
          # newest compact one on the iOS 26.5 runtime so the paywall is
          # checked from 4.7" up to 6.9".
          runtime=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-26-5[^ ]*' | head -n 1)
          echo "::notice title=paywall runtime::$runtime"
          for spec in "SE3|com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation" \
                      "16e|com.apple.CoreSimulator.SimDeviceType.iPhone-16e" \
                      "17ProMax|com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max"; do
            slug=${spec%%|*}; type=${spec#*|}
            udid=$(xcrun simctl create "Paywall $slug" "$type" "$runtime" 2>"create-$slug.log") || {
              echo "::warning title=paywall $slug::$(cat create-$slug.log | tail -n 1)"; continue; }
            xcodebuild test \
              -project ios-protocola/Protocola.xcodeproj \
              -scheme Protocola \
              -configuration Debug \
              -destination "id=$udid" \
              -only-testing:ProtocolaUITests/DesignSnapshotTests/testCapturePaywallOnly \
              -parallel-testing-enabled NO \
              -resultBundlePath "Paywall-$slug.xcresult" \
              CODE_SIGNING_ALLOWED=NO > "paywall-$slug.log" 2>&1 && code=0 || code=$?
            echo "::notice title=paywall $slug::exit $code $(grep -E 'Executed|error:' "paywall-$slug.log" | tail -n 2 | tr '\n' ' ')"
          done
          exit 0

      - name: Export attachments
        if: always()
        run: |
          mkdir -p raw shots
          xcrun xcresulttool export attachments --path Shots.xcresult --output-path raw > export.log 2>&1 || true
          python3 - <<'EOF'
          import json, os, shutil
          try:
              manifest = json.load(open("raw/manifest.json"))
          except Exception as e:
              print("::warning title=export::no manifest: %s %s" % (e, open("export.log").read()[-500:].replace("\n","%0A")))
              raise SystemExit(0)
          for test in manifest:
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  if not name.startswith(("default", "ax-", "dark", "fr-", "pw-", "zz-")):
                      continue
                  base = name.split("_")[0] if name.startswith(("default", "ax-", "zz-")) else name
                  if not base.endswith(".png"):
                      base += ".png"
                  shutil.copy(os.path.join("raw", a["exportedFileName"]), os.path.join("shots", base))
          print("::notice title=exported::" + " ".join(sorted(os.listdir("shots"))))
          EOF
          for bundle in Paywall-*.xcresult; do
            [ -d "$bundle" ] || continue
            slug=${bundle#Paywall-}; slug=${slug%.xcresult}
            rm -rf raw-pw && mkdir raw-pw
            xcrun xcresulttool export attachments --path "$bundle" --output-path raw-pw > /dev/null 2>&1 || continue
            python3 - "$slug" <<'EOF'
          import json, os, shutil, sys
          slug = sys.argv[1]
          try:
              manifest = json.load(open("raw-pw/manifest.json"))
          except Exception:
              raise SystemExit(0)
          for test in manifest:
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or ""
                  if name.startswith("pw-"):
                      shutil.copy(os.path.join("raw-pw", a["exportedFileName"]), os.path.join("shots", "pw-" + slug + ".png"))
          EOF
          done

      - name: Publish to design-screenshots branch
        if: always()
        run: |
          set -e
          trap 'echo "::error title=publish failed::line $LINENO: $BASH_COMMAND"' ERR
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          SHA=${GITHUB_SHA::7}
          if git ls-remote --exit-code --heads origin design-screenshots >/dev/null; then
            git fetch --depth 1 origin design-screenshots
            git worktree add out FETCH_HEAD
          else
            git worktree add --detach out
            (cd out && git checkout --orphan design-screenshots && git rm -rfq . && git clean -fdq)
          fi
          mkdir -p "out/$SHA"
          cp shots/*.png "out/$SHA/" 2>/dev/null || echo "::warning title=publish::no png files"
          cd out
          git add -A
          git commit -qm "Screenshots for $SHA" || { echo "::warning title=publish::nothing to commit"; exit 0; }
          git push origin HEAD:refs/heads/design-screenshots
          echo "::notice title=published::$SHA"
